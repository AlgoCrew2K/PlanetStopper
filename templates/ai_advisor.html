<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Config Advisor — AlphaBot Dashboard v3</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 6px;
            white-space: pre-wrap;
            max-width: 320px;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-8 font-sans">
    <div class="max-w-screen-xl mx-auto">

        <!-- Header -->
        <header class="flex justify-between items-center mb-8 bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-violet-500 to-blue-400"></div>
            <div>
                <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-blue-400">
                    AI Config Advisor
                </h1>
                <p class="text-[11px] text-slate-400 mt-1">Claude-powered suggestion engine — operator must accept each change</p>
            </div>
            <a href="/" class="text-[10px] text-slate-400 hover:text-slate-200 font-bold uppercase tracking-widest transition-colors">
                &larr; Dashboard
            </a>
        </header>

        <!-- Controls -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 mb-6">
            <div class="flex items-end gap-4">
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Symphony ID</label>
                    <input id="symphony-id-input" type="text" placeholder="e.g. my_symphony"
                        class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-violet-500 w-64">
                </div>
                <button id="get-suggestions-btn" onclick="getSuggestions()"
                    class="px-5 py-2 bg-violet-600 hover:bg-violet-500 text-white font-bold text-sm rounded-lg transition-colors shadow-sm">
                    Get Suggestions
                </button>
            </div>
            <div id="advisor-error" class="hidden mt-3 text-rose-400 text-sm"></div>
        </div>

        <!-- Suggestions -->
        <div id="suggestions-container" class="space-y-4"></div>

    </div>

    <script src="{{ url_for('static', filename='ai_advisor.js') }}"></script>
</body>
</html>
