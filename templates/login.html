<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Stopper — {% if confirm_logout %}Sign Out{% else %}Sign In{% endif %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='layout.css') }}">
  {% include '_fonts.html' %}
  <style>
    body {
      background: var(--studio-bg);
      color: var(--studio-ink);
      font-family: var(--studio-sans, Manrope, sans-serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-card {
      background: var(--studio-paper);
      border: 1px solid var(--studio-rule);
      border-radius: 14px;
      padding: 32px;
      width: 100%;
      max-width: 360px;
    }

    .login-wordmark {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-weight: 500;
      font-size: 18px;
      color: var(--studio-ink);
      margin-bottom: 4px;
    }

    .login-wordmark span {
      color: var(--studio-ink-dim);
      font-weight: 400;
      font-size: 13px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--studio-ink-dim);
      margin-bottom: 24px;
    }

    .login-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--studio-ink-dim);
      margin-bottom: 8px;
    }

    .login-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--studio-rule-hi);
      border-radius: 8px;
      background: var(--studio-bg);
      color: var(--studio-ink);
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }

    .login-input:focus-visible {
      outline: 2px solid var(--studio-accent);
      outline-offset: 1px;
    }

    .login-error {
      background: var(--studio-neg-tint);
      border: 1px solid var(--studio-neg-border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--studio-neg);
      margin-bottom: 16px;
    }

    .login-btn {
      width: 100%;
      height: 40px;
      background: var(--studio-accent);
      color: var(--studio-paper);
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .login-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <script src="{{ url_for('static', filename='tweaks.js') }}"></script>
  <div class="login-card">
    <div class="login-wordmark">
      Planet Stopper
      <span>guard</span>
    </div>
{% if confirm_logout %}
    <div class="login-subtitle">Sign out of Planet Stopper?</div>

    <div class="login-error" role="alert" data-testid="logout-message" hidden></div>

    <form id="logout-form" action="/logout" method="post">
      <button class="login-btn" type="submit" data-testid="logout-btn">Sign out</button>
    </form>
{% else %}
    <div class="login-subtitle">Sign in to continue</div>

    {% if error %}
    <div class="login-error" role="alert">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post">
      {# CSRF token — required by the existing CSRF gate on all POSTs #}
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <meta name="csrf-token" content="{{ csrf_token }}">

      <label class="login-label" for="password">Password</label>
      <input
        class="login-input"
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        autofocus
      >

      <button class="login-btn" type="submit">Sign in</button>
    </form>
{% endif %}
  </div>
  {% if confirm_logout %}
  <script src="{{ url_for('static', filename='request_guard.js') }}"></script>
  <script src="{{ url_for('static', filename='logout_confirm.js') }}"></script>
  {% endif %}
</body>
</html>
