# Systemd drop-in: memory guard for the planetstopper-prism council oneshot service.
#
# DE-TEST-MEMCAP-001 / RCA 2026-06-21: belt-and-suspenders for the nightly
# Market Prism council runner (prism_scheduler.py, spawns up to 6 Claude
# subprocess agents).  On the 4 GB DigitalOcean droplet a runaway council run
# could exhaust memory and take down the host alongside the daemon.
#
# MemoryMax=3G matches the daemon guard (both share the 4 GB droplet; in practice
# only one runs at a time — the daemon is idle during the 03:00 council window).
# Restart=on-failure allows the timer to retry a run killed by OOM.
# RestartSec=30s gives the kernel more time to reclaim pages from the
# multi-subprocess council workload before any retry.
#
# PM applies this to the live droplet at the PR gate via:
#   sudo mkdir -p /etc/systemd/system/planetstopper-prism.service.d/
#   sudo cp deploy/planetstopper-prism.service.d/memory.conf \
#           /etc/systemd/system/planetstopper-prism.service.d/memory.conf
#   sudo systemctl daemon-reload
# (No restart needed — drop-in takes effect on the next timer firing.)

[Service]
MemoryMax=3G
Restart=on-failure
RestartSec=30s
