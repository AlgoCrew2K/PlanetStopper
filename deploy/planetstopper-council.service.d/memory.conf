# Systemd drop-in: memory guard for the nightly Market Prism council service.
#
# DE-TEST-MEMCAP-001 / RCA 2026-06-21: belt-and-suspenders for the nightly
# council runner (prism_scheduler.py, spawns up to 6 Claude subprocess agents).
# On the 4 GB DigitalOcean droplet a runaway council run could exhaust memory
# and take down the host alongside the daemon.
#
# Apply to whichever unit name matches the live droplet — DEPLOYMENT.md names
# it planetstopper-prism.service; an alias drop-in is also in
# deploy/planetstopper-prism.service.d/memory.conf.  PM confirms the live name
# before applying.
#
# PM applies at the PR gate via:
#   sudo mkdir -p /etc/systemd/system/planetstopper-council.service.d/
#   sudo cp deploy/planetstopper-council.service.d/memory.conf \
#           /etc/systemd/system/planetstopper-council.service.d/memory.conf
#   sudo systemctl daemon-reload

[Service]
MemoryMax=3G
Restart=on-failure
RestartSec=10s
