# Systemd drop-in: memory guard for the planetstopper Flask daemon.
#
# DE-TEST-MEMCAP-001 / RCA 2026-06-21: a runaway process tree on the dev host
# committed ~238 GB (67.8 GB ceiling), triggering Kernel-Power 41 hard-reboot.
# On the 4 GB DigitalOcean droplet the same failure mode would take down the
# whole host rather than just the daemon process.
#
# MemoryMax=3G caps the daemon at 3 GB (leaving ~1 GB for the OS and Caddy).
# Restart=on-failure ensures an OOM kill auto-recovers instead of leaving the
# dashboard dark.  RestartSec=10s gives the kernel time to reclaim pages before
# the daemon relaunches.
#
# PM applies this to the live droplet at the PR gate via:
#   sudo mkdir -p /etc/systemd/system/planetstopper.service.d/
#   sudo cp deploy/planetstopper.service.d/memory.conf \
#           /etc/systemd/system/planetstopper.service.d/memory.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart planetstopper

[Service]
MemoryMax=3G
Restart=on-failure
RestartSec=10s
