name: tests

on:
  push:
    branches: [main, "assembly/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Run default suite
        # Project defaults (pyproject addopts) exclude live/slow tests and run xdist-parallel.
        run: |
          (while sleep 60; do echo "RES $(date -u +%T) mem=$(free -m | awk 'NR==2{print $3"/"$2}') tmp=$(df -h /tmp | awk 'NR==2{print $5}') procs=$(ps -e | wc -l) fds=$(ls /proc/*/fd 2>/dev/null | wc -l) top=$(ps -eo rss=,pid=,comm= --sort=-rss | head -2 | tr -s ' ' | paste -sd';')"; done) &
          python -m pytest -v --no-header
      - name: Resources after the suite
        if: always()
        run: free -m; df -h /tmp; df -i /tmp; du -sh /tmp/pytest-of-* 2>/dev/null || true
