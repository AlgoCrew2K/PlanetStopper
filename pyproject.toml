[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["templates", "static", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# ── Test files ──────────────────────────────────────────────────────────────────
# SIM*: simplification suggestions are stylistic — behavior-neutral cycle only.
# F841: unused-variable common in pytest mock patterns (side_effect, not var use).
# F811: conftest fixture shadows intentionally (patched_environment per-test).
# B*/UP031/E741: deferred to a follow-on style cycle — not masked, tracked.
# E501: long test docstrings/assertions not wrappable without harming clarity.
"tests/**" = ["SIM101","SIM102","SIM103","SIM105","SIM108","SIM116","SIM117","SIM118",
              "F401","F841","F811","B007","B011","B017","B023","B033","B904","B905",
              "UP031","E741","E501"]

# ── Scratch/archive ──────────────────────────────────────────────────────────────
# .design-handoff/ is a scratch/archive directory not on the execution path.
".design-handoff/**" = ["E402","E501","F401","F841","B007","SIM105","SIM108","SIM116","SIM117","SIM118","SIM102","B904","B905","B023"]

# ── Production modules ───────────────────────────────────────────────────────────

# app.py: SIM105 try/except/pass → contextlib.suppress is a refactor, not a bug.
# B007 loop-var-unused for side-effect-only iteration.  B905 zip-without-strict.
# E501: long Flask route docstrings with contract references; log/error strings.
"app.py" = ["SIM105","SIM118","B007","B905","E501"]

# alpha_bot_execution.py: B007/F841 flagged unsafe-fix by ruff (walrus patterns).
# E501: long inline diagnostic comments; splitting would harm readability.
"alpha_bot_execution.py" = ["B007","F841","E501"]

# autotuner.py: B023 — trial-factory closures capture mutable loop vars; fixing
# requires Optuna refactor (behavior-affecting).  Deferred, NOT masked — tracked.
# B007 side-effect-only iteration.  SIM*/F841 stylistic/intentional (split_idx
# preserved for source-scan tests — see inline comment at autotuner.py:2183).
# E501: long CPCV/walk-forward comments and synthesis prompt strings.
"autotuner.py" = ["B023","B007","B904","SIM102","SIM105","SIM108","SIM116","F841","E501"]

# math_engine.py: E501 — named-constant inline comments intentionally long
# (every constant requires a source citation per the no-magic-numbers rule;
# splitting the citation harms the annotation).  Docstring URL references
# cannot be wrapped.  SIM108 ternary refactor of breakeven-locked guard
# deferred — behavior-affecting restructure.
"math_engine.py" = ["E501","SIM108"]

# database.py: B905 zip-without-strict across 8 call sites (invasive, deferred).
# SIM108 if/else → ternary in _db_file() is a refactor; deferred.
# E501: long SQL fragments and migration-comment lines.
"database.py" = ["B905","SIM108","E501"]

# advisors/*: SIM/B-class stylistic findings and E501 long annotation comments.
"advisors/asset_swap_engine.py"   = ["SIM108","B905","B007","F841","E501"]
"advisors/atlas_cache.py"          = ["E501"]
"advisors/backtest_gate_engine.py" = ["B905","B007","F841","E501"]
"advisors/community_strats.py"     = ["B904"]
"advisors/correlation_diagnostic.py" = ["B905"]
"advisors/lens_pipeline.py"        = ["B007","E501"]
"advisors/logic_change_engine.py"  = ["SIM116","SIM108","E501"]
"advisors/news_corpus.py"          = ["E501"]
"advisors/prism_audit_write.py"    = ["E402"]  # load_dotenv() before imports by design (DE-PRISM-DOTENV)
"advisors/symphony_schema.py"      = ["SIM102"]

# Standalone modules with un-wrappable E501.
"ai_advisor.py"       = ["E501"]
"composer_backtest.py" = ["E501"]
"prism_scheduler.py"  = ["E501"]
"reporting.py"        = ["B007","E501"]  # B007 side-effects-only; E501 Discord/embed strings
"synthetic_history.py" = ["E501"]

# scripts/ and docs/ research scripts — not on the execution path.
"scripts/**" = ["SIM108","E501"]
"docs/**"    = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = """
    -ra --strict-markers -m 'not live and not slow and not perf'
    -n 2 --dist loadfile
    --deselect tests/meta/test_zero_skip_xfail_close.py::test_full_suite_reports_zero_skips_and_zero_xfails
    --deselect tests/meta/test_zero_skip_xfail_close.py::test_pytest_collect_only_does_not_emit_any_forbidden_node_id
"""
markers = [
    "live: tests that hit live APIs (deselect via -m 'not live')",
    "slow: long-running property/calibration tests (deselected by default; opt in via -m 'slow')",
    "perf: wall-clock latency benchmarks; excluded from default run (opt-in: pytest -m perf)",
]

# xdist parallelization notes (Phase 1 — 2026-06-01; worker cap added 2026-06-12):
# - "-n 2 --dist loadfile": each file's tests run together on one worker,
#   preserving within-file ordering invariants and maximizing DB-isolation safety.
# - WORKER COUNT IS CAPPED AT 2 (was "-n auto"). "-n auto" spawned one worker per
#   core, and several engine tests nest joblib.Parallel(n_jobs=-1) / optuna
#   study.optimize(n_jobs=-1) (all cores) inside each worker. The multiplicative
#   fan-out (workers x cores) committed >90 GB of virtual memory and caused two
#   CRITICAL_PROCESS_DIED bugchecks / full PC reboots (2026-06-11, 2026-06-12).
#   Never restore "-n auto". The nested joblib/optuna n_jobs=-1 cap is a separate
#   tracked follow-up. Run ONE pytest invocation at a time across the whole fleet.
# - Two meta-tests that spawn subprocess pytest invocations are permanently deselected
#   from the default xdist run because the subprocess duration exceeds the xdist
#   worker heartbeat window, killing the worker with "node down: Not properly
#   terminated" (confirmed gate5 at 32-33% and 38%, 2026-06-12):
#   * test_full_suite_reports_zero_skips_and_zero_xfails — spawns full suite, timeout=3000s
#   * test_pytest_collect_only_does_not_emit_any_forbidden_node_id — spawns --collect-only,
#     timeout=180s; the import-heavy collection still blocks long enough to time out gw0/gw1.
#   Run both explicitly: pytest tests/meta/test_zero_skip_xfail_close.py
# - All other tests are safe under xdist: _isolate_db (autouse, function-scoped,
#   monkeypatch.setenv) gives per-test DB isolation, and xdist workers are separate
#   processes so within-worker ordering is neutralized by --dist loadfile.
