[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["templates", "static", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -m 'not live and not slow and not perf'"
markers = [
    "live: tests that hit live APIs (deselect via -m 'not live')",
    "slow: long-running property/calibration tests (deselected by default; opt in via -m 'slow')",
    "perf: wall-clock latency benchmarks; excluded from default run (opt-in: pytest -m perf)",
]
