<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AlphaBotPM — Dashboard Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700;8..60,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600;6..72,700&display=swap"
  rel="stylesheet"
/>
<style>
  html, body { margin: 0; background: #f0eee9; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #1a1a1a; }
  #root { width: 100vw; height: 100vh; }
  /* Hide the canvas's default focus-mode chrome ring color a little — leave defaults otherwise */
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="mock-data.js"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" src="bureau.jsx"></script>
<script type="text/babel" src="console.jsx"></script>
<script type="text/babel" src="cockpit-shared.jsx"></script>
<script type="text/babel" src="cockpit.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;
  const { DesignCanvas, DCSection, DCArtboard, DCPostit } = window;
  const { TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakToggle, TweakColor, TweakSelect } = window;
  const { Bureau, ConsoleView, Cockpit } = window;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "density": "balanced",
    "accent": "#1f7a4d",
    "mathOverlays": true,
    "numFormat": "full"
  }/*EDITMODE-END*/;

  // Curated accent options — same hue family across directions so they read consistently
  const ACCENTS = ['#1f7a4d', '#0b6cc4', '#b04420', '#6a3f8a', '#3a3a3a'];

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const data = window.ALPHABOT_DATA;

    return (
      <React.Fragment>
        <DesignCanvas>
          <DCSection
            id="dash"
            title="AlphaBotPM · Dashboard"
            subtitle="Three directions exploring layout, palette, density, and how live risk is visualized. Toggle Tweaks (top-right) for theme & accent."
          >
            <DCArtboard id="bureau" label="A · Bureau — editorial, calm" width={1440} height={1024}>
              <Bureau data={data} t={t} />
            </DCArtboard>
            <DCArtboard id="console" label="B · Console — dense, mono, technical" width={1440} height={1024}>
              <ConsoleView data={data} t={t} />
            </DCArtboard>
            <DCArtboard id="cockpit" label="C · Cockpit — card grid, viz-led" width={1440} height={1024}>
              <Cockpit data={data} t={t} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel>
          <TweakSection label="Theme" />
          <TweakRadio
            label="Mode"
            value={t.theme}
            options={['light', 'dark']}
            onChange={(v) => setTweak('theme', v)}
          />
          <TweakColor
            label="Accent"
            value={t.accent}
            options={ACCENTS}
            onChange={(v) => setTweak('accent', v)}
          />
          <TweakSection label="Layout" />
          <TweakRadio
            label="Density"
            value={t.density}
            options={['compact', 'balanced', 'roomy']}
            onChange={(v) => setTweak('density', v)}
          />
          <TweakSection label="Data display" />
          <TweakToggle
            label="Math overlays (MC, VWAP)"
            value={t.mathOverlays}
            onChange={(v) => setTweak('mathOverlays', v)}
          />
          <TweakRadio
            label="Numbers"
            value={t.numFormat}
            options={['full', 'compact']}
            onChange={(v) => setTweak('numFormat', v)}
          />
        </TweaksPanel>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
